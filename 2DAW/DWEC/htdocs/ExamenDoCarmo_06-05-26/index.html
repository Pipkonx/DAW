<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Examen docarmo</title>
    <!-- VUE 2: Librería principal que permite usar variables y directivas en el HTML -->
    <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.js"></script>
    <!-- AXIOS: Librería para hacer peticiones (GET, POST, etc.) a nuestro api.php de forma asíncrona -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <!-- BOOTSTRAP: Librería CSS externa para que los botones y tablas se vean profesionales automáticamente -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
</head>
<body>
    <!-- id="app": Es el "recinto" donde Vue tiene el control. Lo que esté fuera de este div, Vue lo ignorará. -->
    <div id="app" class="container" style="margin-top:20px">
        <div class="row">
            <div class="col-md-6">
                <h3>trabajadores</h3>
                <table class="table table-hover">
                    <!-- v-for="c in trabajadores": Repite esta fila (<tr>) por cada categoría existente en el array 'trabajadores' de script.js -->
                    <!-- @click="seleccionarCat(c)": Cuando el usuario hace clic aquí, llama a la función pasándole la categoría actual -->
                    <!-- :style="...": Los dos puntos (:) delante indican que el estilo es dinámico (evalúa código JavaScript). 
                         Aquí dice: Si hemos seleccionado una categoría (catSel) Y su ID coincide con esta fila (c.id), 
                         pon el fondo gris oscuro ('background:#eee'), si no, no pongas nada ('') -->
                    <tr v-for="c in trabajadores" @click="seleccionarCat(c)" :style="catSel && catSel.id==c.id ? 'background:#eee' : ''" style="cursor:pointer">
                        <!-- {{ c.nombre }}: Las dobles llaves sirven para "imprimir" variables de Vue directamente en el texto del HTML -->
                        <td>{{ c.nombre }}</td>
                    </tr>
                </table>
            </div>
            
            <!-- v-if="catSel": Este bloque entero <div> SÓLO aparecerá en pantalla si la variable 'catSel' tiene datos 
                 (es decir, si el usuario ya ha hecho clic en alguna categoría). Si es null, Vue lo oculta por completo. -->
            <div class="col-md-6" v-if="catSel">
                <!-- Usamos las llaves dobles de nuevo para poner el nombre de la categoría en el título -->
                <h3>tareas de {{ catSel.nombre }}</h3>
                
                <div class="well">
                    <!-- v-model="formP.nombre": Magia pura de Vue. Vincula este <input> de forma bidireccional con formP.nombre. 
                         Si el usuario escribe, la variable cambia sola en script.js. Si la variable cambia en script.js, el input se actualiza. -->
                    <input v-model="formP.nombre" class="form-control" placeholder="Nombre de la tarea">
                    
                    <input v-model="formP.precio" type="number" step="0.01" class="form-control" style="margin-top:10px">
                    
                    <!-- @click llama a la función guardarP -->
                    <button @click="guardarP" class="btn btn-success" style="margin-top:10px">
                        <!-- {{ condicion ? 'si se cumple' : 'si no se cumple' }}: Esto se llama operador ternario. 
                             Evalúa si estamos editando para mostrar la palabra "Actualizar", si es nuevo muestra "Añadir". -->
                        {{ editandoP ? 'Actualizar tareas' : 'Añadir tareas' }}
                    </button>
                    
                    <!-- Este botón de Cancelar solo se dibuja (v-if) si estamos en modo edición (editandoP === true) -->
                    <button v-if="editandoP" @click="cancelarP" class="btn btn-default" style="margin-top:10px; margin-left:5px">Cancelar</button>
                </div>

                <table class="table">
                    <thead><tr><th>tarea</th><th>id</th><th>titulo</th><th>descripcion</th><th>estado</th><th>prioridad</th><th>trabajador_id</th>
					<th>created_at</th></tr></thead>
                    <tbody>
                        <!-- Bucle v-for para imprimir todos los tareas que nos llegó del servidor -->
                        <tr v-for="p in tareas">
                            <td>{{ p.id }}</td>
                            <td>{{ p.titulo }}</td>
							<td>{{ p.descripcion }}</td>
							<td>{{ p.estado }}</td>
							<td>{{ p.prioridad }}</td>
							<td>{{ p.trabajador_id }}</td>
							<td>{{ p.created_at }}</td>
                            <td>
                                <!-- Le pasamos el objeto completo (p) a la función para cargar sus datos en el formulario -->
                                <button @click="prepararP(p)" class="btn btn-warning btn-xs">Editar</button>
                                <!-- Para borrar, solo necesitamos enviar su ID (p.id) a la función -->
                                <button @click="borrarP(p.id)" class="btn btn-danger btn-xs">X</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Carga nuestra lógica JavaScript. SIEMPRE debe ir al final, justo antes del </body> -->
    <script src="script.js"></script>
</body>
</html>
